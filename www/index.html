<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Daily Tracker</title>
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/bg-400.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/bg-600.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-weight:800;font-style:normal;font-display:swap;src:url(fonts/bg-800.woff2) format('woff2')}
</style>
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#14272b;--mute:#5d7075;--line:#d5dfdb;--study:#1f6f78;--sleep:#5b5bd6;--money:#d98a1c;--bad:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11191b;--card:#1a2528;--ink:#e6efed;--mute:#93a8ac;--line:#2c3b3f;--study:#4fb6c2;--sleep:#8f8ff0;--money:#f0b04a;--bad:#ef7d6b}}
:root[data-theme="dark"]{--bg:#11191b;--card:#1a2528;--ink:#e6efed;--mute:#93a8ac;--line:#2c3b3f;--study:#4fb6c2;--sleep:#8f8ff0;--money:#f0b04a;--bad:#ef7d6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.7rem;font-weight:800;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px;overflow-x:auto;position:relative;scrollbar-width:none}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mute);font:600 .9rem inherit;font-family:inherit;padding:10px 14px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sleep);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:1.1rem;margin:0 0 10px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1}
.stat span{color:var(--mute);font-size:.85rem}
.big{font-size:2.6rem!important}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px}
label{display:block;font-size:.82rem;color:var(--mute);margin-bottom:3px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.go{width:100%;border:0;border-radius:12px;padding:12px;font:600 1rem inherit;font-family:inherit;color:#fff;cursor:pointer}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.72rem;color:var(--mute)}
.col i{display:block;width:100%;border-radius:6px 6px 2px 2px;min-height:3px}
.col em{font-style:normal;margin-bottom:3px;font-size:.7rem}
.col span{margin-top:4px}
.prog{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.prog div{height:100%}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.item small{color:var(--mute);display:block}
.x{border:0;background:none;color:var(--mute);font-size:1.3rem;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);padding:8px 0}
.goal{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
.goal input{width:90px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.75rem;border:1px solid var(--line);color:var(--mute);margin-left:6px}
.chk{display:flex;align-items:center;gap:12px;font-size:1rem;color:var(--ink);padding:11px 0;border-top:1px solid var(--line);margin:0;cursor:pointer}
.chk input{width:22px;height:22px;padding:0;accent-color:var(--study);flex:none}
.gwk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gd{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 2px;font:inherit;cursor:pointer;text-align:center}
.gd b{display:block;font-size:1.5rem;line-height:1.3}
.gd small{color:inherit;opacity:.8}
.gd.done{background:var(--study);color:#fff;border-color:var(--study)}
.gd.miss{border-color:var(--bad);color:var(--bad)}
.gd.today{outline:2px solid var(--sleep);outline-offset:1px}
.gd:disabled{opacity:.4;cursor:default}
.mini{display:flex;gap:8px;margin:8px 0}
.mini input{flex:1;min-width:0}
.mini button{border:0;border-radius:10px;padding:0 14px;font:600 .9rem inherit;font-family:inherit;background:var(--ink);color:var(--bg);cursor:pointer;white-space:nowrap}
.sm{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:8px 12px;font:600 .85rem inherit;font-family:inherit;cursor:pointer}
ol.how{margin:0;padding-left:20px}ol.how li{margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:.72rem;color:var(--mute);padding:4px 0}
.cd{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;font-size:.9rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cd.today{border-color:var(--sleep);font-weight:800}
.cd.sel{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--money)}
textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:84px;resize:vertical}
.sl{margin:10px 0 0}
.sm2{font-size:.78rem;color:var(--mute)}
.slr{display:grid;grid-template-columns:24px 1fr 84px;gap:8px;align-items:center}
.slr input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--study)}
.cd.sel .dots i{background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 10px;font:600 .78rem inherit;font-family:inherit;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
.ax{font-size:10px;fill:var(--mute)}
.vl{font-size:9px;fill:var(--ink)}
.xl{font-size:10px;fill:var(--mute)}
.tgh{display:grid;grid-template-columns:44px repeat(var(--n),1fr);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--card)}
.tgh button{border:0;background:none;color:var(--ink);font:inherit;font-size:.78rem;padding:6px 0;cursor:pointer;text-align:center}
.tgh button b{display:block;font-size:1.1rem}
.tgh button.today b{color:var(--sleep)}
.tgh button.sel{background:var(--bg)}
.tg{height:540px;overflow-y:auto;border:1px solid var(--line);border-radius:0 0 12px 12px;background:var(--bg)}
.tgi{display:grid;grid-template-columns:44px repeat(var(--n),1fr);height:1152px;position:relative}
.hrs{position:relative}
.hrs span{position:absolute;right:6px;font-size:.66rem;color:var(--mute);transform:translateY(-50%);white-space:nowrap}
.dc{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px);cursor:pointer;min-width:0}
.rb{position:absolute;left:0;right:0;pointer-events:none}
.rb small{font-size:.65rem;color:var(--mute);padding:2px 4px;display:block}
.rb.z{background:color-mix(in srgb,var(--line) 70%,transparent)}
.rb.g{background:color-mix(in srgb,var(--study) 28%,transparent)}
.rb.e{background:color-mix(in srgb,var(--sleep) 28%,transparent)}
.eb{position:absolute;background:var(--sleep);color:#fff;border-radius:6px;padding:2px 5px;overflow:hidden;font-size:.74rem;line-height:1.2;z-index:2;border-left:3px solid rgba(0,0,0,.25)}
.eb b{display:block;font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.eb small{opacity:.9;font-size:.68rem}
.eb.dn{opacity:.5;text-decoration:line-through}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3}
</style>
<style>
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#auth.on{display:flex}
#auth .card{width:100%;max-width:380px;margin:0}
#auth .btn2{width:100%;border:1px solid var(--line);background:none;color:var(--ink);border-radius:12px;padding:12px;font:600 1rem inherit;font-family:inherit;cursor:pointer;margin-top:8px}
#authMsg{min-height:1.3em;font-size:.85rem;margin:10px 0 0;color:var(--bad)}
#authMsg.ok{color:var(--study)}
.lnk{background:none;border:0;color:var(--study);text-decoration:underline;font:inherit;cursor:pointer;padding:0 4px}
</style>
</head>
<body>
<main>
<h1>My Daily Tracker</h1>
<p class="sub" id="dateLine"></p>
<p class="sub" id="syncLine" style="font-size:.8rem;margin-top:-10px"></p>
<p class="sub" id="acctLine" style="font-size:.8rem;margin-top:-10px"></p>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<div id="auth"><div class="card">
<h1 style="margin-top:0">My Daily Tracker</h1>
<p class="sub">Sign in to sync your data on all your devices.</p>
<label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" style="margin-bottom:10px">
<label for="aPass">Password (at least 6 characters)</label><input id="aPass" type="password" autocomplete="current-password">
<button class="go" style="background:var(--study);margin-top:14px" onclick="doSignIn()">Sign in</button>
<button class="btn2" onclick="doSignUp()">Create account</button>
<p id="authMsg"></p>
</div></div>
<script src="vendor/supabase.js"></script>
<script>
const K='daily-tracker-v1';
let S={study:[],sleep:[],money:[],food:[],care:{},brows:[],gym:{},eng:{},engNotes:[],hunger:[],todos:[],events:[],plan:{},shop:{},bills:[],goals:{study:4,sleep:6,save:0}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
var SY=null;
const saveLocal=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const persist=()=>{saveLocal();pushSync()};
if(!S.sleepGoalV2){S.goals.sleep=6;S.sleepGoalV2=1;persist()}
function normH(){S.hunger.forEach(h=>{h.steps=h.steps||[];h.date=h.date||'';h.why=h.why||'';h.saves=h.saves||[]})}
normH();S._t=S._t||{};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=ymd(new Date());
const last=n=>{const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(ymd(d))}return a};
const wk=(()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)})();
const MONTH=TODAY.slice(0,7);
const sum=(a,f)=>a.filter(f).reduce((s,x)=>s+(x.min??x.amt??0),0);
const fh=m=>Math.floor(m/60)+'h '+Math.round(m%60)+'m';
const rs=n=>'Rs '+Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayName=s=>new Date(s+'T00:00').toLocaleDateString('en-US',{weekday:'short'});
const nice=s=>new Date(s+'T00:00').toLocaleDateString('en-US',{day:'numeric',month:'short'});
document.getElementById('dateLine').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

let tab='home';
const tabs=[['home','Home'],['todo','To-do'],['calendar','Calendar'],['study','Study'],['sleep','Sleep'],['money','Money'],['bills','Payments'],['food','Food'],['plan','Meal plan'],['care','Care'],['gym','Gym'],['english','English'],['hunger','Hunger'],['history','History'],['weeks','Weeks'],['months','Months']];
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
function go(t){tab=t;location.hash=t;render()}

function bars(vals,labels,goal,color,fmt){
  const mx=Math.max(goal||0,...vals,1);
  return `<div class="bars">${vals.map((v,i)=>`<div class="col"><em>${v?fmt(v):''}</em><i style="height:${Math.max(v/mx*100*.78,v?3:2)}%;background:${v?color:'var(--line)'}"></i><span>${labels[i]}</span></div>`).join('')}</div>`}
function prog(v,goal,color){const p=goal?Math.min(100,v/goal*100):0;return `<div class="prog"><div style="width:${p}%;background:${color}"></div></div>`}
function list(arr,fn,key){
  if(!arr.length)return '<p class="empty">Nothing logged yet. Add your first entry above.</p>';
  return arr.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,15).map(e=>`<div class="item"><div>${fn(e)}</div><button class="x" aria-label="Delete entry" onclick="del('${key}',${e.id})">×</button></div>`).join('')}
function del(k,id){S[k]=S[k].filter(e=>e.id!==id);persist();render()}
const val=id=>document.getElementById(id).value;
const CATS=['Food','Transport','Shopping','Education','Wasted','Bills','Health','Other'];
const CC={Food:'#d9622b',Transport:'#2f8fbf',Shopping:'#b04fb0',Education:'#1f9a78',Wasted:'#c9372c',Bills:'#8a8f3a',Health:'#d0527a',Other:'#7b8a90'};
const SP=()=>[...S.money.filter(e=>e.type==='spend'),...S.food.filter(e=>e.amt>0).map(e=>({date:e.date,cat:'Food',amt:e.amt}))];
const cats=a=>{const t={};a.forEach(e=>{const c=e.cat||'Other';t[c]=(t[c]||0)+e.amt});return t};
const catBars=t=>{const en=Object.entries(t).sort((a,b)=>b[1]-a[1]);if(!en.length)return '<p class="empty">No spending yet.</p>';const tot=en.reduce((s,x)=>s+x[1],0);return en.map(([c,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:.9rem"><span>${esc(c)}</span><b>${rs(v)} <small style="color:var(--mute);font-weight:400">${Math.round(v/tot*100)}%</small></b></div>${prog(v,tot,CC[c]||CC.Other)}</div>`).join('')};

function addStudy(){
  const m=(+val('sh')||0)*60+(+val('sm')||0);
  if(m<=0)return alert('Enter the time you studied.');
  S.study.push({id:Date.now(),date:val('sd'),subject:val('ss').trim()||'General study',min:m});persist();render()}
function addSleep(){
  const b=val('sb'),w=val('sw');if(!b||!w)return alert('Enter bedtime and wake-up time.');
  const [bh,bm]=b.split(':').map(Number),[wh,wm]=w.split(':').map(Number);
  let m=(wh*60+wm)-(bh*60+bm);if(m<=0)m+=1440;
  S.sleep.push({id:Date.now(),date:val('sdt'),bed:b,wake:w,min:m});persist();render()}
function addMoney(){
  const a=+val('ma');if(!(a>0))return alert('Enter an amount.');
  S.money.push({id:Date.now(),date:val('md'),type:val('mt'),cat:val('mc'),amt:a});persist();render()}
function setGoal(k,v){S.goals[k]=Math.max(0,+v||0);persist();render()}

function addFood(){
  const n=val('fn').trim();if(!n)return alert('Enter the food name.');
  const p=val('fp').trim();
  S.food.push({id:Date.now(),date:val('fd'),name:n,meal:val('fm'),amt:p?Math.max(0,+p||0):0,free:!p});persist();render()}

function foodView(){
  const d=last(7),v=d.map(x=>sum(S.food,e=>e.date===x));
  const T=S.food.filter(e=>e.date===TODAY),W=S.food.filter(e=>e.date>=wk),M=S.food.filter(e=>e.date.startsWith(MONTH));
  const k=m=>m>=1000?(m/1000).toFixed(1)+'k':Math.round(m);
  return `<div class="card"><h2>Add food</h2>
  <div class="row"><div><label for="fn">Food</label><input id="fn" placeholder="e.g. Rice and curry"></div><div><label for="fp">Price (Rs) – optional</label><input id="fp" type="number" min="0" placeholder="Leave empty if no price"></div></div>
  <div class="row"><div><label for="fm">Meal</label><select id="fm"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option><option>Drink</option></select></div><div><label for="fd">Date</label><input id="fd" type="date" value="${TODAY}"></div></div>
  <button class="go" style="background:var(--bad)" onclick="addFood()">Add food</button></div>
  <div class="card"><h2>Totals</h2><div class="stats">
  <div class="stat"><b>${T.length}</b><span>items today (${rs(sum(T,()=>1))})</span></div>
  <div class="stat"><b>${W.length}</b><span>items this week (${rs(sum(W,()=>1))})</span></div>
  <div class="stat"><b>${M.length}</b><span>items this month (${rs(sum(M,()=>1))})</span></div>
  <div class="stat"><b>${M.filter(e=>e.free).length}</b><span>with no price this month</span></div></div></div>
  <div class="card"><h2>Food spending, last 7 days</h2>${bars(v,d.map(dayName),0,'var(--bad)',k)}</div>
  <div class="card"><h2>Recent food</h2>${list(S.food,e=>`<b>${esc(e.name)}</b> · ${e.free?'<span class="tag">no price</span>':rs(e.amt)}<small>${e.meal} · ${nice(e.date)}</small>`,'food')}</div>`}

function homeView(){return homeBase()+backupCard()}
function homeBase(){
  const st=sum(S.study,e=>e.date===TODAY),stw=sum(S.study,e=>e.date>=wk);
  const sl=S.sleep.filter(e=>e.date===TODAY)[0],
        sp=sum(SP(),e=>e.date>=wk),spm=sum(SP(),e=>e.date.startsWith(MONTH)),
        sv=sum(S.money,e=>e.type==='save'&&e.date.startsWith(MONTH));
  return `${billsAlert()}<div class="card"><h2>Today</h2><div class="stats">
  <div class="stat"><b class="big" style="color:var(--study)">${fh(st)}</b><span>studied of ${S.goals.study}h goal</span></div>
  <div class="stat"><b class="big" style="color:var(--sleep)">${sl?fh(sl.min):'–'}</b><span>slept last night</span></div></div>${prog(st,S.goals.study*60,'var(--study)')}</div>
  <div class="card"><h2>This week</h2><div class="stats">
  <div class="stat"><b>${fh(stw)}</b><span>study time</span></div>
  <div class="stat"><b>${rs(sp)}</b><span>spent</span></div></div></div>
  <div class="card"><h2>This month</h2><div class="stats">
  <div class="stat"><b>${rs(spm)}</b><span>spent</span></div>
  <div class="stat"><b style="color:var(--money)">${rs(sv)}</b><span>saved</span></div></div></div>
  <div class="card"><h2>Food today</h2><div class="stats"><div class="stat"><b>${S.food.filter(e=>e.date===TODAY).length}</b><span>items</span></div><div class="stat"><b>${rs(sum(S.food,e=>e.date===TODAY))}</b><span>spent on food</span></div></div></div>
  <div class="card"><h2>Routine today</h2><div class="stats"><div class="stat"><b style="color:var(--study)">${todayCare()}</b><span>skincare steps done</span></div><div class="stat"><b>${gymToday()}</b><span>gym, 5:30 to 6:45 AM</span></div>
  <div class="stat"><b>${engToday()}</b><span>English, 10 to 11 PM</span></div></div></div>
  <div class="card"><h2>Today’s schedule</h2>${homeSched()}</div>
  <div class="card"><h2>Today’s meals</h2>${homeMeals()}</div>
  <div class="card"><h2>To-do</h2><div class="stats"><div class="stat"><b style="color:var(--study)">${todoCt('day',TODAY)}</b><span>today’s tasks done</span></div><div class="stat"><b>${todoCt('week',wk)}</b><span>this week’s tasks done</span></div></div></div>
  <div class="card"><h2>My hunger list</h2><div class="stats"><div class="stat"><b>${S.hunger.filter(h=>h.done).length}/${S.hunger.length}</b><span>achieved</span></div><div class="stat"><b style="color:var(--money)">${rs(S.hunger.reduce((s,h)=>s+h.saves.reduce((a,x)=>a+x.amt,0),0))}</b><span>saved for my list</span></div></div></div>`}

function studyView(){
  const d=last(7),v=d.map(x=>sum(S.study,e=>e.date===x));
  const subj={};S.study.filter(e=>e.date>=wk).forEach(e=>subj[e.subject]=(subj[e.subject]||0)+e.min);
  const sb=Object.entries(subj).sort((a,b)=>b[1]-a[1]).map(([k,m])=>`<div class="item"><span>${esc(k)}</span><b>${fh(m)}</b></div>`).join('');
  return `<div class="card"><h2>Log study time</h2>

function setSync(t){const e=document.getElementById('syncLine');if(e)e.textContent=t}
function mergeSec(k,a,b){
  if(Array.isArray(a)&&Array.isArray(b)){const ids=new Set(a.map(x=>x.id));return a.concat(b.filter(x=>!ids.has(x.id)))}
  if(a&&b&&typeof a==='object'&&!Array.isArray(a)){const o=Object.assign({},b,a);if(k==='care')Object.keys(b).forEach(d=>{if(a[d]&&b[d])o[d]=[...new Set([...a[d],...b[d]])]});return o}
  return a!==undefined?a:b}
let pushing=false,again=false;
async function pushSync(){
  if(!SY||!SY.ready)return;
  if(pushing){again=true;return}
  pushing=true;
  try{
    for(const k of SECT){
      const j=JSON.stringify(S[k]);
      if(j===SY.sent[k])continue;
      const t=Date.now();
      await SY.col.doc(k).set({j:j,t:t});
      SY.sent[k]=j;S._t[k]=t;
    }
    saveLocal();setSync('Synced ✓ across your devices');
  }catch(e){setSync('Sync problem. Your data is saved on this device.')}
  pushing=false;
  if(again){again=false;pushSync()}
}

async function startSync(uid){
  if(SY&&SY.uid===uid)return;
  setSync('Syncing…');
  let busy=false,again=false;
  SY={uid:uid,sent:{},ready:false,col:{
    doc:k=>({set:async o=>{const r=await sb.from('tracker_sections').upsert({user_id:uid,section:k,j:o.j,t:o.t},{onConflict:'user_id,section'});if(r.error)throw r.error}}),
    onSnapshot:(cb,errCb)=>{
      const run=async()=>{
        if(busy){again=true;return}
        busy=true;
        try{const r=await sb.from('tracker_sections').select('section,j,t');if(r.error)throw r.error;
          cb({docs:r.data.map(x=>({id:x.section,exists:true,data:()=>({j:x.j,t:Number(x.t)})}))})}
        catch(e){errCb&&errCb(e)}
        busy=false;if(again){again=false;run()}};
      run();
      try{sb.channel('ts-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'tracker_sections',filter:'user_id=eq.'+uid},run).subscribe()}catch(e){}
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)run()});
      window.addEventListener('online',run);
      setInterval(()=>{if(!document.hidden)run()},45000)}}};
  try{
    SY.col.onSnapshot(snap=>{
      const remote={};
      snap.docs.forEach(d=>{if(d.exists){const x=d.data();if(x&&typeof x.j==='string')remote[d.id]={j:x.j,t:x.t||0}}});
      let changed=false;
      if(!SY.ready){
        SECT.forEach(k=>{
          const r=remote[k];if(!r)return;
          let rem;try{rem=JSON.parse(r.j)}catch(e){return}
          if(!S._joined)S[k]=mergeSec(k,rem,S[k]);
          else if(r.t>(S._t[k]||0))S[k]=rem;
          SY.sent[k]=r.j;S._t[k]=r.t;
        });
        S._joined=true;SY.ready=true;changed=true;
      }else{
        SECT.forEach(k=>{
          const r=remote[k];if(!r)return;
          if(r.j===JSON.stringify(S[k])){SY.sent[k]=r.j;return}

  }catch(e){setSync('Sync unavailable right now. Your data is saved on this device.')}
}

    if(C&&C.isNativePlatform&&C.isNativePlatform()){
      const P=C.Plugins,w=await P.Filesystem.writeFile({path:name,data:data,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:name,url:w.uri,dialogTitle:'Save or send your file'});return}
    const bl=new Blob([data],{type:'text/plain'}),a=document.createElement('a');
    a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000)
  }catch(e){if(!/cancel|dismiss/i.test(String((e&&e.message)||e)))alert('Could not save the file.')}}
